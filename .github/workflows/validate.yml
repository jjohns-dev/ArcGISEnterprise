name: validate
run-name: validate

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      checks: write # required by dorny/test-reporter (granted to the reusable)
    uses: PS-MCS/mcssec-ops/.github/workflows/ps-module-validate.yml@main
    with:
      min-tests: 1871 # 1881 executed - min(floor(1881 * 0.05), 10) = 1881 - 10
