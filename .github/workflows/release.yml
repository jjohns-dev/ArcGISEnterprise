name: release
run-name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.0.0
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - .gitignore
      - .github/**

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub release
    uses: PS-MCS/mcssec-ops/.github/workflows/ps-module-release.yml@main
